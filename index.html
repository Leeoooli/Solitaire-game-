<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>词牌接龙</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：一张绿色牌桌，手机竖屏为主。上方是步数旗和牌堆，中间是类别空位，下面是牌列，底部是操作按钮。 */
:root{
  --felt:#2f9e58; --felt-deep:#1f7a41; --felt-lite:#58c07d; --felt-ink:#0f4424;
  --paper:#fbfaf4; --paper-edge:#d9d4c3; --ink:#27302a; --ink-soft:#6b756e; --grey:#a9b4ad;
  --gold:#f0b429; --gold-deep:#b97d06; --blue:#2f6fe0; --blue-lite:#4b86f2; --rose:#e4544f;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--felt);color:var(--paper);font-family:var(--body);font-weight:500;
  background-image:radial-gradient(ellipse at 50% 20%,var(--felt-lite) 0,var(--felt) 55%,var(--felt-deep) 130%);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;
  padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  container-type:inline-size;--n:4;--gap:8px}
#app > *{--cw:min(98px,calc((100cqw - (var(--n) - 1) * var(--gap)) / var(--n)))}

header{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);font-size:20px;line-height:1;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.26)}
.brand{flex:none;display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;white-space:nowrap}
.brand span{font-size:12px;background:var(--felt-ink);border-radius:99px;padding:2px 9px;white-space:nowrap}
#prog{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.mini{width:12px;height:17px;border-radius:3px;background:var(--grey);box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.mini.done{background:
  linear-gradient(135deg,var(--blue) 25%,transparent 25%) -3px 0/6px 6px,
  linear-gradient(225deg,var(--blue) 25%,transparent 25%) -3px 0/6px 6px,
  linear-gradient(315deg,var(--blue) 25%,transparent 25%) 0 0/6px 6px,
  linear-gradient(45deg,var(--blue) 25%,transparent 25%) 0 0/6px 6px,var(--blue-lite);box-shadow:0 0 0 1.5px var(--paper) inset}

#turn{display:flex;align-items:stretch;gap:8px}
.pl{flex:1 1 0;min-width:0;background:var(--felt-ink);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.3}
.pl b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl span{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl.on{background:var(--gold);color:#3a2800}
.mid{flex:1.5 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:12px;line-height:1.35}
.mid b{font-size:13.5px}
#chatBtn{flex:none;width:42px;border-radius:12px;background:var(--felt-ink);font-size:18px;position:relative}
#chatBtn i{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:11px;font-style:normal;line-height:18px;text-align:center}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ribbon{background:var(--felt-lite);color:var(--felt-ink);padding:8px 14px 22px;text-align:center;min-width:82px;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.ribbon small{display:block;font-size:12px;border-bottom:1.5px solid rgba(15,68,36,.35);padding-bottom:3px;margin-bottom:2px}
.ribbon b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.ribbon.low b{color:#a3201c}
.piles{display:flex;gap:10px;align-items:flex-start}
#waste{position:relative;width:calc(var(--cw)*1.22);height:calc(var(--cw)*1.4)}
#waste .peek{position:absolute;left:calc(var(--cw)*.22);top:0}
#waste .card.top,#waste .ghost{position:absolute;left:0;top:0}

.row{display:grid;grid-template-columns:repeat(var(--n),var(--cw));gap:var(--gap);justify-content:center;align-items:start}
#found{padding-top:14px}
#tab{min-height:calc(var(--cw)*3.2);flex:1}
.col{display:flex;flex-direction:column;width:var(--cw)}

.card,.slot,.ghost{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);position:relative;flex:none;display:block}
.card{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1.5px var(--paper-edge) inset,0 2px 3px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw)*.03);overflow:hidden}
.card[data-z]{touch-action:none;cursor:grab}
.card.back{background:
  linear-gradient(135deg,var(--blue) 25%,transparent 25%) -8px 0/16px 16px,
  linear-gradient(225deg,var(--blue) 25%,transparent 25%) -8px 0/16px 16px,
  linear-gradient(315deg,var(--blue) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,var(--blue) 25%,transparent 25%) 0 0/16px 16px,var(--blue-lite);
  box-shadow:0 0 0 3px var(--paper) inset,0 2px 3px rgba(0,0,0,.22)}
.col .card.back:not(:last-child){margin-bottom:calc(var(--cw)*-1.27)}
.col .card.under{margin-bottom:calc(var(--cw)*-1.06);justify-content:flex-start;padding-top:calc(var(--cw)*.07)}
.card .lab{white-space:nowrap;line-height:1.15;font-weight:500}
.l1{font-size:calc(var(--cw)*.4)} .l2{font-size:calc(var(--cw)*.27)} .l3{font-size:calc(var(--cw)*.235)} .l4{font-size:calc(var(--cw)*.2)} .l5{font-size:calc(var(--cw)*.16)}
.card .emo{font-family:var(--emoji);font-size:calc(var(--cw)*.52);line-height:1.1}
.card.under .lab{font-size:calc(var(--cw)*.17)}
.card.under .emo{font-size:calc(var(--cw)*.2)}
.card.cat{box-shadow:0 0 0 3px var(--gold) inset,0 2px 3px rgba(0,0,0,.22);background:#fff3cc}
.card.cat .lab{font-weight:700}
.crown{position:absolute;left:calc(var(--cw)*.08);top:calc(var(--cw)*.03);font-size:calc(var(--cw)*.19);color:var(--gold-deep);line-height:1.2}
.card.drag{z-index:60;pointer-events:none;cursor:grabbing;box-shadow:0 0 0 1.5px var(--paper-edge) inset,0 10px 18px rgba(0,0,0,.35)}
.card.cat.drag{box-shadow:0 0 0 3px var(--gold) inset,0 10px 18px rgba(0,0,0,.35)}
.card.home{transition:transform .14s ease-out;z-index:60}
.tgt{outline:3px solid var(--gold);outline-offset:1px}
.hint{animation:pulse .7s ease-in-out 3}
.pop{animation:pop .16s ease-out}
@keyframes pulse{50%{outline:4px solid #fff;outline-offset:2px;transform:scale(1.05)}}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.hint,.pop{animation:none}.card.home{transition:none}}

.slot,.ghost{background:rgba(15,68,36,.38);box-shadow:0 0 0 2px rgba(15,68,36,.25) inset;display:grid;place-items:center;color:var(--felt-lite)}
.slot .big{font-size:calc(var(--cw)*.5);line-height:1}
.slot.full{background:#fff3cc;color:var(--ink);box-shadow:0 0 0 3px var(--gold) inset,0 2px 3px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible}
.slot .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2800;font-size:12px;font-weight:700;
  padding:1px 7px;border-radius:5px;white-space:nowrap;max-width:118%;line-height:1.35}
.slot .cnt{position:absolute;right:calc(var(--cw)*.09);top:calc(var(--cw)*.06);font-size:calc(var(--cw)*.15);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.slot .emo{font-family:var(--emoji);font-size:calc(var(--cw)*.5);line-height:1.1}
.slot .lab{white-space:nowrap}
.slot .wait{font-size:calc(var(--cw)*.15);color:var(--ink-soft)}
#stock{position:relative;cursor:pointer}
#stock .badge{position:absolute;right:5px;top:5px;background:var(--paper);color:var(--ink);font-size:12px;border-radius:6px;padding:0 5px;font-variant-numeric:tabular-nums}
#stock.ghost{font-size:calc(var(--cw)*.42);color:var(--paper)}
.emptycol{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);border:2px dashed rgba(255,255,255,.35)}

footer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
footer button{background:var(--felt-ink);border-radius:14px;padding:10px 4px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
footer button i{font-style:normal;font-size:19px;line-height:1.1}
footer button:hover{background:#0b3a1e}
footer button:disabled{opacity:.4;cursor:default}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,30,24,.94);color:#fff;
  padding:9px 16px;border-radius:99px;font-size:14px;max-width:calc(100% - 40px);text-align:center;pointer-events:none;z-index:90;transition:opacity .2s}
#toast.off{opacity:0}

.scrim{position:fixed;inset:0;background:rgba(8,30,16,.62);z-index:80;display:flex;align-items:flex-end;justify-content:center}
#over.scrim{align-items:center;padding:20px}
.panel{background:var(--paper);color:var(--ink);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;user-select:text;-webkit-user-select:text}
#over .panel{border-radius:22px;max-width:360px;text-align:center;padding:26px 22px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em}
.panel .x{width:36px;height:36px;border-radius:10px;background:#ece8da;font-size:18px}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{background:#ece8da;border-radius:12px;padding:9px 6px;text-align:center;font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.chip small{font-weight:500;font-size:11.5px;color:var(--ink-soft)}
.chip.on{background:var(--felt);color:#fff}.chip.on small{color:#dff5e7}
.levels .chip{font-family:var(--display);font-weight:400;font-size:19px;padding:6px 2px;gap:0}.levels .chip small{min-height:1.3em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#ece8da;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55}
.box .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box input,#chatIn{flex:1;min-width:0;font:inherit;font-size:16px;border:2px solid var(--paper-edge);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink)}
#roomCode{font-size:18px;letter-spacing:.25em;text-align:center}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:10px;background:#fff;font-size:20px;font-weight:700;box-shadow:0 0 0 1.5px var(--paper-edge) inset}
.stepper b{min-width:28px;text-align:center;font-family:var(--display);font-weight:400;font-size:22px}
.btn{background:var(--felt);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.alt{background:#ece8da;color:var(--ink)}
.box .btn.alt{background:#fff;box-shadow:0 0 0 1.5px var(--paper-edge) inset}
.presets .btn{padding:6px 0;min-width:38px;font-size:14px}
.btn.warn{background:#fff;color:var(--rose);box-shadow:0 0 0 1.5px var(--rose) inset}
.code{font-family:var(--display);font-size:34px;letter-spacing:.18em;color:var(--felt-deep);line-height:1}
#inviteUrl{font-size:12px;word-break:break-all;background:#fff;border-radius:8px;padding:6px 8px}
.rules{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7;color:var(--ink)}
#over h2{justify-content:center;font-size:30px}
#over p{margin:0;font-size:15px;color:var(--ink-soft);line-height:1.6}
#over .acts{display:flex;flex-direction:column;gap:8px}
#chatLog{min-height:150px;max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{align-self:flex-start;max-width:82%}
.msg small{font-size:11px;color:var(--ink-soft)}
.msg span{display:block;background:#ece8da;border-radius:14px;padding:7px 12px;font-size:15px;word-break:break-word}
.msg.me{align-self:flex-end;text-align:right}
.msg.me span{background:var(--felt);color:#fff;text-align:left}
#chatLog .none{margin:auto;color:var(--ink-soft);font-size:14px;text-align:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:#ece8da;border-radius:99px;padding:5px 12px;font-size:13px}
#chatForm{display:flex;gap:8px}
</style>

</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
    <div class="brand"><b id="lvName"></b><span id="modeTag" hidden></span></div>
    <div id="prog"></div>
  </header>
  <div id="turn" hidden></div>
  <section class="top">
    <div class="ribbon" id="ribbon"><small>剩余步数</small><b id="left">0</b></div>
    <div class="piles"><div id="waste"></div><div id="stockWrap"></div></div>
  </section>
  <section class="row" id="found"></section>
  <section class="row" id="tab"></section>
  <footer>
    <button id="hintBtn"><i>💡</i>提示</button>
    <button id="undoBtn"><i>↩</i>撤销</button>
    <button id="againBtn"><i>↻</i>重来</button>
    <button id="newBtn"><i>🂠</i>换一副</button>
  </footer>
</div>
<div id="sheet" class="scrim" hidden><div class="panel" id="sheetBody"></div></div>
<div id="chat" class="scrim" hidden><div class="panel">
  <h2>聊天<button class="x" id="chatClose" aria-label="关闭">✕</button></h2>
  <div id="chatLog"></div>
  <div class="quick" id="chatQuick"></div>
  <form id="chatForm"><input id="chatIn" maxlength="80" placeholder="说点什么…" autocomplete="off" aria-label="消息"><button class="btn">发送</button></form>
</div></div>
<div id="over" class="scrim" hidden><div class="panel" id="overBody"></div></div>
<div id="toast" class="off" role="status"></div>

<script>
/* ---------- 词库：同一个词可以出现在两个类别里（多义词），一副牌里它只属于其中一个 ---------- */
const BANK=[

['花','玫瑰🌹 向日葵🌻 郁金香🌷 樱花🌸 荷花 菊花 牡丹 茉莉 梅花 杜鹃 百合'],

['颜色','红 橙 黄 绿 青 蓝 紫 黑 白 灰'],
['金属','金 银 铜 铁 锡 铝 锌 铅 钛 镍'],
['方向','东 南 西 北 上 下 左 右 前 后 中'],
['麻将','东 南 西 北 中 发 白 筒 条 万'],
['朝代','唐 宋 元 明 清 汉 秦 隋 晋 周'],
['太阳系','太阳 水星 金星 地球🌍 火星 木星 土星 天王星 海王星 月球🌙'],
['节气','立春 雨水 惊蛰 春分 清明 谷雨 芒种 夏至 白露 霜降 大雪 冬至'],
['节日','春节 中秋 端午 元宵 清明 国庆 重阳 七夕 除夕 元旦'],

['城市','北京 上海 广州 深圳 成都 杭州 西安 南京 吉林 重庆 武汉'],
['星座','白羊 金牛 双子 巨蟹 狮子 处女 天秤 天蝎 射手 摩羯 水瓶 双鱼'],
['动物园','老虎🐯 狮子 大象🐘 长颈鹿🦒 熊猫🐼 猴子🐒 斑马🦓 袋鼠🦘 河马🦛 骆驼🐫'],

/* 60 关：类别从 4 个加到 12 个，每类词语从 3 张加到 8 张，多义词从第 9 关开始出现，步数余量从 15% 收到 2% */
const LV=Array.from({length:60},(_,i)=>({name:`第 ${i+1} 关`,cats:Math.min(12,4+Math.floor(i/6)),k:Math.min(8,3+Math.floor((i+5)/10)),

const catOf=c=>Math.floor(c/100), isCat=c=>c%100===0;
const wordOf=c=>BANK[catOf(c)].words[c%100-1];
function rngOf(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function mkState(d){return{k:d.k,total:d.cats,cols:d.cols.map(a=>({down:a.slice(0,-1),up:a.slice(-1)})),stock:d.stock.slice(),waste:[],
  found:Array(d.slots).fill(null),done:0,left:d.limit,used:0,hitSlot:-1,gain:0}}
/* 牌列里同类的牌叠在一起后整叠移动。金色类别牌只能进空位，或盖在同类词语上；盖上后这一叠不能再加牌，只能整叠进空位。 */
function apply(S,ms){
  ms=String(ms).split('@')[0];S.hitSlot=-1;S.gain=0;
  if(ms==='d'){
    if(!S.stock.length){if(!S.waste.length)return false;S.stock=S.waste.reverse();S.waste=[]}
    S.waste.push(S.stock.pop());S.left--;S.used++;return true}
  const p=ms.split(':'),src=+p[1],dst=+p[3];
  if(p[0]!=='m'||![src,dst].every(Number.isInteger))return false;
  let cards;
  if(src<0){if(!S.waste.length)return false;cards=[S.waste.at(-1)]}
  else{const c=S.cols[src];if(!c||!c.up.length)return false;cards=c.up.slice()}
  const cat=catOf(cards[0]),hasCat=cards.some(isCat);
  if(dst>=100){const f=dst-100;if(f>=S.found.length)return false;const F=S.found[f];
    if(!F){if(!hasCat)return false;const ws=cards.filter(c=>!isCat(c));S.found[f]={cat,n:ws.length,last:ws.length?ws.at(-1):null};S.gain=ws.length}
    else{if(F.cat!==cat)return false;F.n+=cards.length;F.last=cards.at(-1);S.gain=cards.length}
    S.hitSlot=f;
    if(S.found[f].n>=S.k){S.found[f]=null;S.done++}
  }else{
    if(dst===src)return false;const t=S.cols[dst];if(!t)return false;
    if(hasCat&&(cards.length>1||!t.up.length))return false;
    if(t.up.length){const top=t.up.at(-1);if(isCat(top)||catOf(top)!==cat)return false}
    t.up.push(...cards)}
  if(src<0)S.waste.pop();else{const c=S.cols[src];c.up.length=0;if(c.down.length)c.up.push(c.down.pop())}
  S.left--;S.used++;return true}
function options(S){
  const o={A:[],B:[],C:[],D:[],E:[],F:[],G:[]};
  const empty=S.found.findIndex(F=>!F),emptyCol=S.cols.findIndex(c=>!c.up.length),srcs=[];
  if(S.waste.length)srcs.push([-1,[S.waste.at(-1)]]);
  S.cols.forEach((c,j)=>{if(c.up.length)srcs.push([j,c.up])});
  for(const [s,cards] of srcs){const cat=catOf(cards[0]),hasCat=cards.some(isCat),f=S.found.findIndex(F=>F&&F.cat===cat);
    if(f>=0)o.A.push(`m:${s}:0:${100+f}`);
    else if(hasCat&&empty>=0)o.B.push(`m:${s}:0:${100+empty}`);
    if(!hasCat||cards.length===1)S.cols.forEach((t,j)=>{if(j!==s&&t.up.length){const top=t.up.at(-1);if(!isCat(top)&&catOf(top)===cat)(s<0?o.D:o.C).push(`m:${s}:0:${j}`)}});
    if(emptyCol>=0&&!hasCat){if(s<0)o.F.push(`m:-1:0:${emptyCol}`);else if(S.cols[s].down.length)o.E.push(`m:${s}:0:${emptyCol}`)}}
  if(S.stock.length||S.waste.length)o.G.push('d');
  return o}
function playout(deal,r){
  const S=mkState(deal);let idle=0;
  for(let step=0;step<1100;step++){
    if(S.done===S.total)return S.used;
    const o=options(S);let m;
    if(o.A.length)m=o.A[0];
    else{const busy=o.B.length+o.C.length+o.D.length+o.E.length>0,W={C:5,D:5,B:3,E:2,F:.5,G:busy?.12:1},list=[];let sum=0;
      for(const k in W)for(const x of o[k]){list.push([x,W[k]]);sum+=W[k]}
      if(!list.length)return 0;
      if(list.length===1&&list[0][0]==='d'){if(++idle>S.stock.length+S.waste.length+2)return 0}else idle=0;
      let q=r()*sum;m=list[list.length-1][0];for(const [x,w] of list){if((q-=w)<0){m=x;break}}}
    apply(S,m)}
  return 0}
function pickCats(lv,r){
  const pool=shuffle(BANK.map((_,i)=>i),r),ch=[];
  while(ch.length<lv.cats&&pool.length){
    let idx=0;
    if(lv.amb){
      if(!ch.length){const s=pool.findIndex(x=>LINK[x].size);if(s>=0)idx=s}
      else{const j=pool.findIndex(x=>ch.some(y=>LINK[y].has(x)));if(j>=0&&r()<.7)idx=j}}
    else{idx=pool.findIndex(x=>!ch.some(y=>LINK[y].has(x)));if(idx<0)idx=0}
    ch.push(pool.splice(idx,1)[0])}
  return ch}
function pickWords(cats,lv,r){
  const inD=new Set(cats),used=new Set(),out={};let amb=0;const cap=Math.max(1,Math.ceil(lv.k/3));
  for(const c of shuffle(cats.slice(),r)){
    const W=BANK[c].words,ws=shuffle(W.map((_,i)=>i),r).filter(i=>!used.has(W[i].t));
    const sh=ws.filter(i=>TC[W[i].t].some(o=>o!==c&&inD.has(o))),pl=ws.filter(i=>!sh.includes(i)),take=[];
    for(const i of sh)if(take.length<cap&&amb<lv.amb){take.push(i);amb++}
    for(const i of pl)if(take.length<lv.k)take.push(i);
    for(const i of sh)if(take.length<lv.k&&!take.includes(i)){take.push(i);amb++}
    if(take.length<lv.k)return null;
    for(const i of take)used.add(W[i].t);out[c]=take}
  return out}
/* 步数：每张牌至少移一次、牌堆每张至少翻一次是数学下限。再用上千次模拟找这副牌实际能走出的最短解，上限只比它多一点点。
   同一关（variant 0）的牌局是固定的，所以可以反复尝试同一道题。 */
function genDeal(level,variant){
  variant=variant|0;const lv=LV[level],r=rngOf((level+1)*7919+variant*104729+17);let best=null;const N=260;
  for(let t=0;t<40;t++){
    const cats=pickCats(lv,r),pick=pickWords(cats,lv,r);if(!pick)continue;
    const codes=[];for(const c of cats){codes.push(c*100);for(const w of pick[c])codes.push(c*100+w+1)}
    shuffle(codes,r);const cols=[];let p=0;
    for(let j=0;j<lv.cols;j++){cols.push(codes.slice(p,p+lv.base+j));p+=lv.base+j}
    const deal={level,variant,k:lv.k,cats:lv.cats,slots:lv.slots,cols,stock:codes.slice(p),limit:9999};
    let wins=0,min=1e9;for(let n=0;n<N;n++){const u=playout(deal,r);if(u){wins++;if(u<min)min=u}}
    if(!best||wins>best.wins)best={deal,wins,min};
    if(wins/N>=lv.rate)break}
  const d=best.deal,floor=d.cols.flat().length+d.stock.length*2;
  if(best.wins)for(let n=0;n<3000&&best.min>floor+1;n++){const u=playout(d,r);if(u&&u<best.min)best.min=u}
  d.best=best.wins?best.min:floor+20;d.limit=d.best+Math.max(2,Math.round(d.best*lv.slack));
  return d}

async function play(m){

  G.moves.push(tag);step(tag);

    busy=true;afterMove();
    try{await roomWrite({moves:G.moves.slice()})}
    catch(e){toast('这一步没发出去，请再试一次');G.moves.pop();rebuild();render()}

  if(G.S.done===G.S.total&&G.mode!=='online'){const w=store.get(KEY+'wins')||{};w[G.deal.level]=(w[G.deal.level]||0)+1;store.set(KEY+'wins',w)}

function zones(src){

  document.querySelectorAll('#found .slot').forEach((el,j)=>{if(legal(`m:${src}:0:${100+j}`))zs.push({dst:100+j,el,r:el.getBoundingClientRect()})});
  return zs}
function bestZone(){
  const a=DR.els[0].getBoundingClientRect(),b=DR.els.at(-1).getBoundingClientRect();
  const c={left:a.left,right:a.right,top:a.top,bottom:b.bottom};let best=null,area=0;
  for(const z of DR.zones){const w=Math.min(c.right,z.r.right+8)-Math.max(c.left,z.r.left-8),h=Math.min(c.bottom,z.r.bottom+8)-Math.max(c.top,z.r.top-8);
    if(w>0&&h>0&&w*h>area){area=w*h;best=z}}
  return best}

/* ---------- 联机：房间状态是一份小数据，Claude 里存数据库，独立网页里两个浏览器直连 ---------- */
function goOnline(code,id){myId=id;G.mode='online';G.room=code;R=null;RD=null;NET='on';unread=0;$('sheet').hidden=true}
function applyRoom(d){
  const first=!R,joined=R&&!R.b&&d.b,oldPer=G.per;R={a:d.a,b:d.b};RD=d;
  G.per=clampPer(d.per);if(G.per!==oldPer&&!$('sheet').hidden)setTimeout(renderSheet,0);G.at=d.at|0;G.who=d.who?1:0;

  if(joined)toast(`${G.names[1]} 进来了，可以开始`);

  if(same&&!first)return renderBar();

  POP=grew;render();POP=false}
async function roomWrite(patch){
  if(!P2P)return roomRef.update({...patch,ts:Date.now()});
  if(myId==='H'){Object.assign(P,patch);broadcast();applyRoom(P)}
  else{if(!conn||!conn.open)throw new Error('offline');conn.send({k:'p',patch});Object.assign(P,patch);applyRoom(P)}}
const fresh=()=>({na:myName(),nb:'',deal:G.dealStr,moves:[],per:G.per,at:0,who:0,ca:[],cb:[]});

/* Claude 页面里的联机 */
async function createRoom(){
  if(P2P)return p2pHost();
  if(canWrite===false)return toast('你没有参与权限，无法创建房间');
  try{
    for(let t=0;t<8;t++){
      const code=String(1000+Math.random()*9000|0),ref=db.doc(ROOMS+code),snap=await ref.get();
      if(snap.exists&&Date.now()-((snap.data()||{}).ts||0)<12*3600e3)continue;
      await ref.set({a:uid,b:'',...fresh(),ts:Date.now()});
      return enter(code)}
    toast('房间太多了，稍后再试')}
  catch(e){toast('创建失败：'+(e&&e.code==='invalid_argument'?'你没有写入权限':'请稍后重试'))}}
async function joinRoom(code,quiet){
  code=String(code||'').trim();if(!/^\d{4}$/.test(code))return toast('请输入 4 位房间号');
  if(P2P)return p2pJoin(code,quiet);
  try{
    const ref=db.doc(ROOMS+code),snap=await ref.get();
    if(!snap.exists){store.del('cp.room');if(!quiet)toast('没有找到这个房间');return}
    const d=snap.data();
    if(d.a!==uid&&d.b!==uid){if(!d.b)await ref.update({b:uid,nb:myName(),ts:Date.now()});else if(!quiet)toast('房间已满，你可以观战')}
    enter(code)}
  catch(e){if(!quiet)toast('加入失败：'+(e&&e.code==='invalid_argument'?'你没有写入权限':'请稍后重试'))}}
function enter(code){
  if(unsub)unsub();
  goOnline(code,uid);store.set('cp.room',code);roomRef=db.doc(ROOMS+code);
  clearTimeout(loadT);loadT=setTimeout(()=>toast('连接有点慢，请检查网络'),10000);
  unsub=roomRef.onSnapshot(snap=>{clearTimeout(loadT);if(!snap.exists){toast('房间不存在了');return leaveRoom()}applyRoom(snap.data())},
    ()=>{clearTimeout(loadT);toast('和房间的连接断开了');leaveRoom()})}

/* 独立网页里的联机：PeerJS 牵线后两个浏览器直连。房主保存牌局并存一份在本机，刷新后用原房间号恢复；客人掉线自动重连。 */
const ALLOW=['moves','deal','per','at','who','nb','cb'];
function loadPeer(){return window.Peer?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function p2pClose(){clearTimeout(reT);try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}conn=peer=null}
function hostSave(){if(myId==='H'&&P&&G.mode==='online')store.set('cp.host',{code:G.room,P,t:Date.now()})}
function broadcast(){if(conn&&conn.open)try{conn.send({k:'s',P})}catch(e){}hostSave()}
async function p2pHost(code,restore,n){
  n=n|0;
  try{await loadPeer()}catch(e){return toast('联机组件没加载出来，请检查网络')}
  if(!code)code=String(1000+Math.random()*9000|0);
  if(!restore&&!n)toast('正在创建房间…');
  const pr=peer=new Peer(PRE+code);
  pr.on('open',()=>{if(peer!==pr)return;
    P=restore||{a:'H',...fresh()};P.b='';
    goOnline(code,'H');applyRoom(P);hostSave();
    if(!restore)toast('房间 '+code+' 建好了，在菜单里复制邀请链接发给朋友')});
  pr.on('connection',c=>{
    if(conn&&conn.open){c.on('open',()=>{try{c.send({k:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400)});return}
    conn=c;
    c.on('open',()=>{if(!P||conn!==c)return;P.b='G';broadcast();applyRoom(P)});
    c.on('data',d=>{if(!P||conn!==c||!d||d.k!=='p'||!d.patch||typeof d.patch!=='object')return;
      for(const k of ALLOW)if(k in d.patch)P[k]=d.patch[k];broadcast();applyRoom(P)});
    c.on('close',()=>{if(conn!==c)return;conn=null;if(P&&G.mode==='online'){P.b='';toast('对方掉线了，等他回来');applyRoom(P);hostSave()}})});
  pr.on('disconnected',()=>{if(peer===pr)try{pr.reconnect()}catch(e){}});
  pr.on('error',e=>{if(peer!==pr)return;
    if(e&&e.type==='unavailable-id'){try{pr.destroy()}catch(_){}peer=null;
      if(restore&&n<6)reT=setTimeout(()=>p2pHost(code,restore,n+1),2500);
      else if(!restore&&n<5)p2pHost(null,null,n+1);
      else{toast('房间没能恢复，请重新创建');store.del('cp.host')}}
    else if(G.mode!=='online'){toast('创建失败，请稍后重试');p2pClose()}})}
async function p2pJoin(code,quiet,n){
  n=n|0;
  try{await loadPeer()}catch(e){return toast('联机组件没加载出来，请检查网络')}
  if(!quiet&&!n)toast('正在连接…');
  let got=false,dead=false;const pr=peer=new Peer();
  const lost=()=>{if(dead||peer!==pr)return;dead=true;clearTimeout(timer);try{pr.destroy()}catch(e){}peer=conn=null;
    if(G.mode==='online'&&myId==='G'){const k=got?0:n+1;if(k>30){toast('连不上房主了');return leaveRoom()}
      NET='re';renderBar();reT=setTimeout(()=>p2pJoin(code,true,k),2500)}
    else if(n<2)reT=setTimeout(()=>p2pJoin(code,quiet,n+1),1500);
    else{store.del('cp.guest');if(!quiet)toast('没连上。请确认房间号，并且房主的页面还开着')}};
  const timer=setTimeout(()=>{if(!got)lost()},12000);
  pr.on('open',()=>{if(peer!==pr)return;
    const c=conn=pr.connect(PRE+code,{reliable:true,serialization:'json'});
    c.on('data',d=>{if(!d||peer!==pr)return;
      if(d.k==='full'){dead=true;clearTimeout(timer);toast('房间已经满了');store.del('cp.guest');if(G.mode==='online')leaveRoom();else p2pClose();return}
      if(d.k!=='s'||!d.P||typeof d.P.deal!=='string')return;
      const first=!got;got=true;clearTimeout(timer);
      if(G.mode!=='online')goOnline(code,'G');NET='on';store.set('cp.guest',code);
      P=d.P;applyRoom(P);
      if(first&&myName()&&P.nb!==myName())roomWrite({nb:myName()}).catch(()=>{})});
    c.on('close',lost)});
  pr.on('error',lost)}
function leaveRoom(){
  if(P2P){p2pClose();P=null;store.del('cp.host');store.del('cp.guest')}
  if(unsub)unsub();unsub=null;roomRef=null;R=null;RD=null;G.room=null;NET='on';unread=0;store.del('cp.room');myId=P2P?null:uid;
  $('chat').hidden=true;
  if(!loadSave()){G.mode='solo';G.per=1;G.at=0;G.who=0;G.names=['玩家A','玩家B'];setDeal(genDeal(0,0))}
  render()}
function invite(){
  const url=location.href.split('#')[0]+'#r'+G.room,show=()=>{const el=$('inviteUrl');if(el){el.hidden=false;el.textContent=url}};
  try{navigator.clipboard.writeText(url).then(()=>toast('邀请链接已复制'),show)}catch(e){show()}}

$('sheet').addEventListener('change',e=>{
  const el=e.target.closest('[data-n]');if(!el)return;const v=el.value.trim().slice(0,8);
  if(el.dataset.n==='me'){store.set('cp.name',v);const m=me();if(G.mode==='online'&&m>=0)roomWrite({[m?'nb':'na']:v}).catch(()=>{})}
  else{G.names[+el.dataset.n]=v||'玩家'+'AB'[+el.dataset.n];save();renderBar()}});
$('over').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='again')restart();else if(b.dataset.a==='new')newDeal(null,1+(Math.random()*1e6|0));else newDeal(G.deal.level+1,0)});

/* ---------- 启动 ---------- */
(function start(){
  if(!loadSave()){setDeal(genDeal(0,0));save()}
  render();
  (async()=>{
    if(P2P){
      capsReady=true;
      const h=(location.hash.match(/^#r(\d{4})$/)||[])[1],host=store.get('cp.host'),alive=host&&host.P&&Date.now()-host.t<6*3600e3;
      if(h){try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}}
      if(h&&!(alive&&host.code===h))p2pJoin(h);
      else if(alive)p2pHost(host.code,host.P);
      else{const g=store.get('cp.guest');if(g)p2pJoin(String(g),true)}
      return}
    try{db=await window.claude.use('db');user=await window.claude.use('user');
      if(user){uid=await user.id();canWrite=await user.can('data.write')}}catch(e){}
    myId=uid;capsReady=true;if(!$('sheet').hidden)renderSheet();
    const code=store.get('cp.room');if(db&&uid&&code)joinRoom(code,true)})()})();
</script>
</body>
</html>
