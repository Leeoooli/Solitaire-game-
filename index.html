<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>词牌接龙</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：一张绿色牌桌，手机竖屏为主。上方是步数旗和牌堆，中间是类别空位，下面是牌列，底部是操作按钮。 */
:root{
  --felt:#2f9e58; --felt-deep:#1f7a41; --felt-lite:#58c07d; --felt-ink:#0f4424;
  --paper:#fbfaf4; --paper-edge:#d9d4c3; --ink:#27302a; --ink-soft:#6b756e; --grey:#a9b4ad;
  --gold:#f0b429; --gold-deep:#b97d06; --blue:#2f6fe0; --blue-lite:#4b86f2; --rose:#e4544f;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--felt);color:var(--paper);font-family:var(--body);font-weight:500;
  background-image:radial-gradient(ellipse at 50% 20%,var(--felt-lite) 0,var(--felt) 55%,var(--felt-deep) 130%);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  container-type:inline-size;--n:4;--gap:8px}
#app > *{--cw:min(98px,calc((100cqw - (var(--n) - 1) * var(--gap)) / var(--n)))}

header{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);font-size:20px;line-height:1;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.26)}
.brand{flex:none;display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;white-space:nowrap}
.brand span{font-size:12px;background:var(--felt-ink);border-radius:99px;padding:2px 9px;white-space:nowrap}
#prog{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.mini{width:12px;height:17px;border-radius:3px;background:var(--grey);box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.mini.done{background:
  linear-gradient(135deg,var(--blue) 25%,transparent 25%) -3px 0/6px 6px,
  linear-gradient(225deg,var(--blue) 25%,transparent 25%) -3px 0/6px 6px,
  linear-gradient(315deg,var(--blue) 25%,transparent 25%) 0 0/6px 6px,
  linear-gradient(45deg,var(--blue) 25%,transparent 25%) 0 0/6px 6px,var(--blue-lite);box-shadow:0 0 0 1.5px var(--paper) inset}

#turn{border-radius:12px;background:var(--felt-ink);padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#turn.mine{background:var(--gold);color:#3a2800}
#turn .who{font-weight:700}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ribbon{background:var(--felt-lite);color:var(--felt-ink);padding:8px 14px 22px;text-align:center;min-width:82px;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.ribbon small{display:block;font-size:12px;border-bottom:1.5px solid rgba(15,68,36,.35);padding-bottom:3px;margin-bottom:2px}
.ribbon b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.ribbon.low b{color:#a3201c}
.piles{display:flex;gap:10px;align-items:flex-start}
#waste{position:relative;width:calc(var(--cw)*1.22);height:calc(var(--cw)*1.4)}
#waste .peek{position:absolute;left:calc(var(--cw)*.22);top:0}
#waste .card.top,#waste .ghost{position:absolute;left:0;top:0}

.row{display:grid;grid-template-columns:repeat(var(--n),var(--cw));gap:var(--gap);justify-content:center;align-items:start}
#found{padding-top:14px}
#tab{min-height:calc(var(--cw)*3.2);flex:1}
.col{display:flex;flex-direction:column;width:var(--cw)}

.card,.slot,.ghost{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);position:relative;flex:none;display:block}
.card{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1.5px var(--paper-edge) inset,0 2px 3px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw)*.03);overflow:hidden}
.card[data-z]{touch-action:none;cursor:grab}
.card.back{background:
  linear-gradient(135deg,var(--blue) 25%,transparent 25%) -8px 0/16px 16px,
  linear-gradient(225deg,var(--blue) 25%,transparent 25%) -8px 0/16px 16px,
  linear-gradient(315deg,var(--blue) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,var(--blue) 25%,transparent 25%) 0 0/16px 16px,var(--blue-lite);
  box-shadow:0 0 0 3px var(--paper) inset,0 2px 3px rgba(0,0,0,.22)}
.col .card.back:not(:last-child){margin-bottom:calc(var(--cw)*-1.27)}
.col .card.under{margin-bottom:calc(var(--cw)*-1.04);justify-content:flex-start;padding-top:calc(var(--cw)*.075)}
.card .lab{white-space:nowrap;line-height:1.15;font-weight:500}
.l1,.l2{font-size:calc(var(--cw)*.27)} .l3{font-size:calc(var(--cw)*.235)} .l4{font-size:calc(var(--cw)*.2)} .l5{font-size:calc(var(--cw)*.16)}
.card .emo{font-family:var(--emoji);font-size:calc(var(--cw)*.46);line-height:1.1}
.card .emo + .lab{font-size:calc(var(--cw)*.165)}
.card.under .lab{font-size:calc(var(--cw)*.17)}
.card.under .emo{font-size:calc(var(--cw)*.2)}
.card.cat{box-shadow:0 0 0 3px var(--gold) inset,0 2px 3px rgba(0,0,0,.22);background:#fff8e3}
.card.cat .lab{font-weight:700}
.crown{position:absolute;left:calc(var(--cw)*.08);top:calc(var(--cw)*.03);font-size:calc(var(--cw)*.19);color:var(--gold-deep);line-height:1.2}
.card.drag{z-index:60;pointer-events:none;cursor:grabbing;box-shadow:0 0 0 1.5px var(--paper-edge) inset,0 10px 18px rgba(0,0,0,.35)}
.card.cat.drag{box-shadow:0 0 0 3px var(--gold) inset,0 10px 18px rgba(0,0,0,.35)}
.card.home{transition:transform .14s ease-out;z-index:60}
.tgt{outline:3px solid var(--gold);outline-offset:1px}
.hint{animation:pulse .7s ease-in-out 3}
.pop{animation:pop .16s ease-out}
@keyframes pulse{50%{outline:4px solid #fff;outline-offset:2px;transform:scale(1.05)}}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.hint,.pop{animation:none}.card.home{transition:none}}

.slot,.ghost{background:rgba(15,68,36,.38);box-shadow:0 0 0 2px rgba(15,68,36,.25) inset;display:grid;place-items:center;color:var(--felt-lite)}
.slot .big{font-size:calc(var(--cw)*.5);line-height:1}
.slot.full{background:#fff8e3;color:var(--ink);box-shadow:0 0 0 3px var(--gold) inset,0 2px 3px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible}
.slot .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2800;font-size:12px;font-weight:700;
  padding:1px 7px;border-radius:5px;white-space:nowrap;max-width:118%;line-height:1.35}
.slot .cnt{position:absolute;right:calc(var(--cw)*.09);top:calc(var(--cw)*.06);font-size:calc(var(--cw)*.15);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.slot .emo{font-family:var(--emoji);font-size:calc(var(--cw)*.46);line-height:1.1}
.slot .emo + .lab{font-size:calc(var(--cw)*.165)}
.slot .lab{white-space:nowrap}
.slot .wait{font-size:calc(var(--cw)*.15);color:var(--ink-soft)}
#stock{position:relative;cursor:pointer}
#stock .badge{position:absolute;right:5px;top:5px;background:var(--paper);color:var(--ink);font-size:12px;border-radius:6px;padding:0 5px;font-variant-numeric:tabular-nums}
#stock.ghost{font-size:calc(var(--cw)*.42);color:var(--paper)}
.emptycol{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);border:2px dashed rgba(255,255,255,.35)}

footer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
footer button{background:var(--felt-ink);border-radius:14px;padding:10px 4px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
footer button i{font-style:normal;font-size:19px;line-height:1.1}
footer button:hover{background:#0b3a1e}
footer button:disabled{opacity:.4;cursor:default}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,30,24,.94);color:#fff;
  padding:9px 16px;border-radius:99px;font-size:14px;max-width:calc(100% - 40px);text-align:center;pointer-events:none;z-index:70;transition:opacity .2s}
#toast.off{opacity:0}

.scrim{position:fixed;inset:0;background:rgba(8,30,16,.62);z-index:80;display:flex;align-items:flex-end;justify-content:center}
#over.scrim{align-items:center;padding:20px}
.panel{background:var(--paper);color:var(--ink);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;user-select:text;-webkit-user-select:text}
#over .panel{border-radius:22px;max-width:360px;text-align:center;padding:26px 22px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em}
.panel .x{width:36px;height:36px;border-radius:10px;background:#ece8da;font-size:18px}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{background:#ece8da;border-radius:12px;padding:9px 6px;text-align:center;font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.chip small{font-weight:500;font-size:11.5px;color:var(--ink-soft)}
.chip.on{background:var(--felt);color:#fff}.chip.on small{color:#dff5e7}
.levels .chip{font-family:var(--display);font-weight:400;font-size:19px;padding:7px 2px;gap:0}.levels .chip small{min-height:1.3em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.online{background:#ece8da;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55}
.online .line{display:flex;gap:8px;flex-wrap:wrap}
.online input{flex:1;min-width:0;font:inherit;font-size:18px;letter-spacing:.25em;text-align:center;border:2px solid var(--paper-edge);border-radius:10px;padding:7px;background:#fff;color:var(--ink)}
.btn{background:var(--felt);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.alt{background:#ece8da;color:var(--ink)}
.btn.warn{background:#fff;color:var(--rose);box-shadow:0 0 0 1.5px var(--rose) inset}
.code{font-family:var(--display);font-size:34px;letter-spacing:.18em;color:var(--felt-deep);line-height:1}
.rules{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7;color:var(--ink)}
#over h2{justify-content:center;font-size:30px}
#over p{margin:0;font-size:15px;color:var(--ink-soft);line-height:1.6}
#over .acts{display:flex;flex-direction:column;gap:8px}
</style>

</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
    <div class="brand"><b id="lvName"></b><span id="modeTag" hidden></span></div>
    <div id="prog"></div>
  </header>
  <div id="turn" hidden></div>
  <section class="top">
    <div class="ribbon" id="ribbon"><small>剩余步数</small><b id="left">0</b></div>
    <div class="piles"><div id="waste"></div><div id="stockWrap"></div></div>
  </section>
  <section class="row" id="found"></section>
  <section class="row" id="tab"></section>
  <footer>
    <button id="hintBtn"><i>💡</i>提示</button>
    <button id="undoBtn"><i>↩</i>撤销</button>
    <button id="againBtn"><i>↻</i>重来</button>
    <button id="newBtn"><i>🂠</i>换一副</button>
  </footer>
</div>
<div id="sheet" class="scrim" hidden><div class="panel" id="sheetBody"></div></div>
<div id="over" class="scrim" hidden><div class="panel" id="overBody"></div></div>
<div id="toast" class="off" role="status"></div>

<script>
/* ---------- 词库 ---------- */
const BANK=[
['交通工具','飞机✈️ 火车🚆 轮船🚢 自行车🚲 公交车🚌 地铁🚇 出租车🚕 摩托车🏍️'],
['水果','苹果🍎 香蕉🍌 葡萄🍇 西瓜🍉 草莓🍓 桃子🍑 菠萝🍍 樱桃🍒'],
['蔬菜','胡萝卜🥕 西兰花🥦 茄子🍆 玉米🌽 土豆🥔 黄瓜🥒 辣椒🌶️ 洋葱🧅'],
['动物园','老虎🐯 狮子🦁 大象🐘 长颈鹿🦒 熊猫🐼 猴子🐒 斑马🦓 袋鼠🦘'],
['海洋生物','鲸鱼🐳 海豚🐬 章鱼🐙 鲨鱼🦈 螃蟹🦀 龙虾🦞 乌贼🦑 海龟🐢'],
['乐器','钢琴🎹 吉他🎸 小提琴🎻 鼓🥁 萨克斯🎷 小号🎺 二胡 笛子'],
['天气','晴天☀️ 下雨🌧️ 下雪❄️ 彩虹🌈 闪电⚡ 龙卷风🌪️ 大雾 冰雹'],
['颜色','红色 蓝色 绿色 黄色 紫色 橙色 黑色 白色'],
['身体部位','眼睛👁️ 耳朵👂 鼻子👃 嘴巴👄 手掌✋ 脚🦶 牙齿🦷 大脑🧠'],
['扑克牌','红心♥️ 方块♦️ 梅花♣️ 黑桃♠️ 大王 小王 同花顺 洗牌'],
['早餐','豆浆 油条 包子 煎饼 白粥 馒头 煎蛋🍳 面包🍞'],
['学科','数学 语文 物理 化学 生物 历史 地理 英语'],
['服装','裤子👖 衬衫👔 裙子👗 外套🧥 袜子🧦 帽子🧢 围巾🧣 手套🧤'],
['运动','足球⚽ 篮球🏀 网球🎾 乒乓球🏓 羽毛球🏸 游泳🏊 滑雪⛷️ 排球🏐'],
['职业','医生 教师 警察 厨师 律师 记者 司机 护士'],
['家具','沙发🛋️ 床🛏️ 椅子🪑 桌子 衣柜 书架 茶几 鞋柜'],
['文具','铅笔✏️ 橡皮 尺子📏 剪刀✂️ 笔记本📓 胶水 回形针📎 钢笔🖊️'],
['节日','春节 中秋节 端午节 元宵节 清明节 国庆节 重阳节 七夕'],
['餐具','菜刀🔪 筷子🥢 勺子🥄 铁锅 饭碗🥣 盘子🍽️ 叉子🍴 砧板'],
['太空','月亮🌙 地球🌍 火星 彗星☄️ 火箭🚀 卫星🛰️ 宇航员🧑‍🚀 银河'],
['饮料','绿茶🍵 咖啡☕ 果汁🧃 可乐🥤 啤酒🍺 红酒🍷 奶茶🧋 矿泉水'],
['花','玫瑰🌹 向日葵🌻 郁金香🌷 樱花🌸 荷花🪷 菊花 牡丹 茉莉'],
['电器','电视📺 冰箱 洗衣机 空调 电脑💻 手机📱 微波炉 吹风机'],
['昆虫','蝴蝶🦋 蜜蜂🐝 蚂蚁🐜 瓢虫🐞 蜻蜓 蚊子🦟 蟋蟀🦗 蟑螂🪳'],
['城市','北京 上海 广州 深圳 成都 杭州 西安 南京'],
['甜点','蛋糕🍰 冰淇淋🍦 巧克力🍫 饼干🍪 甜甜圈🍩 布丁🍮 糖果🍬 棉花糖'],
].map(([name,s])=>({name,words:s.split(' ').map(x=>{const m=x.match(/^([一-鿿]+)(.*)$/);return{t:m[1],e:m[2]}})}));

/* 关卡：类别数、每类词数、牌列数、空位数、首列盖牌数、比最优解多给的步数比例、是否看图 */
const LV=Array.from({length:36},(_,i)=>({name:`第 ${i+1} 关`,cats:4+Math.floor(i*8/35),k:3+Math.round(i*4/35),cols:i<4?3:i<22?4:5,slots:i<8?3:4,base:i<8?2:3,
  slack:.5-i*.012,pic:i>=18?1:0,rate:Math.max(.03,.5-i*.015)}));

/* ---------- 规则（纯逻辑） ---------- */
const catOf=c=>Math.floor(c/10), isCat=c=>c%10===0;
const wordOf=c=>isCat(c)?BANK[catOf(c)].name:BANK[catOf(c)].words[c%10-1].t;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function mkState(d){return{k:d.k,total:d.cats,cols:d.cols.map(a=>({down:a.slice(0,-1),up:a.slice(-1)})),stock:d.stock.slice(),waste:[],
  found:Array(d.slots).fill(null),done:0,left:d.limit,used:0,justDone:null,hitSlot:-1}}
/* 皇冠牌只能进空位，或者盖在同类词语上；盖上之后那一叠就锁住，只能整叠拖进空位。 */
function apply(S,ms){
  S.justDone=null;S.hitSlot=-1;
  if(ms==='d'){
    if(!S.stock.length){if(!S.waste.length)return false;S.stock=S.waste.reverse();S.waste=[]}
    S.waste.push(S.stock.pop());S.left--;S.used++;return true}
  const p=String(ms).split(':'),src=+p[1],i=+p[2],dst=+p[3];
  if(p[0]!=='m'||![src,i,dst].every(Number.isInteger))return false;
  let cards;
  if(src<0){if(!S.waste.length)return false;cards=[S.waste.at(-1)]}
  else{const c=S.cols[src];if(!c||i<0||i>=c.up.length)return false;cards=c.up.slice(i)}
  const cat=catOf(cards[0]),hasCat=cards.some(isCat);
  if(dst>=100){const f=dst-100;if(f>=S.found.length)return false;const F=S.found[f];
    if(!F){if(!hasCat)return false;const ws=cards.filter(c=>!isCat(c));S.found[f]={cat,n:ws.length,last:ws.length?ws.at(-1):null}}
    else{if(F.cat!==cat)return false;F.n+=cards.length;F.last=cards.at(-1)}
    S.hitSlot=f;
    if(S.found[f].n>=S.k){S.found[f]=null;S.done++;S.justDone=cat}
  }else{
    if(dst===src)return false;const t=S.cols[dst];if(!t)return false;
    if(hasCat&&(cards.length>1||i>0||!t.up.length))return false;
    if(t.up.length){const top=t.up.at(-1);if(isCat(top)||catOf(top)!==cat)return false}
    t.up.push(...cards)}
  if(src<0)S.waste.pop();else{const c=S.cols[src];c.up.length=i;if(!c.up.length&&c.down.length)c.up.push(c.down.pop())}
  S.left--;S.used++;return true}
function options(S){

/* ---------- 联机 ---------- */
async function createRoom(){
  if(P2P)return p2pCreate();
  if(canWrite===false)return toast('你没有参与权限，无法创建房间');
  try{
    for(let t=0;t<8;t++){
      const code=String(1000+Math.random()*9000|0),ref=db.doc('rooms/'+code),snap=await ref.get();
      if(snap.exists&&Date.now()-((snap.data()||{}).ts||0)<12*3600e3)continue;
      const deal=genDeal(G.deal.level);
      await ref.set({a:uid,b:'',level:deal.level,deal:JSON.stringify(deal),moves:[],ts:Date.now()});
      return enter(code)}
    toast('房间太多了，稍后再试')}
  catch(e){toast('创建失败：'+(e&&e.code==='invalid_argument'?'你没有写入权限':'请稍后重试'))}}
async function joinRoom(code,quiet){
  code=String(code||'').trim();if(!/^\d{4}$/.test(code))return toast('请输入 4 位房间号');
  if(P2P)return p2pJoin(code);
  try{
    const ref=db.doc('rooms/'+code),snap=await ref.get();
    if(!snap.exists){store.del('cp.room');if(!quiet)toast('没有找到这个房间');return}
    const d=snap.data();
    if(d.a!==uid&&d.b!==uid){if(!d.b)await ref.update({b:uid,ts:Date.now()});else if(!quiet)toast('房间已满，你可以观战')}
    enter(code)}
  catch(e){if(!quiet)toast('加入失败：'+(e&&e.code==='invalid_argument'?'你没有写入权限':'请稍后重试'))}}
function enter(code){
  if(unsub)unsub();
  G.mode='online';G.room=code;R=null;store.set('cp.room',code);roomRef=db.doc('rooms/'+code);
  $('sheet').hidden=true;
  clearTimeout(loadT);loadT=setTimeout(()=>toast('连接有点慢，请检查网络'),10000);
  unsub=roomRef.onSnapshot(onRoom,()=>{clearTimeout(loadT);toast('和房间的连接断开了');leaveRoom()})}
function onRoom(snap){
  clearTimeout(loadT);
  if(!snap.exists){toast('房间不存在了');return leaveRoom()}
  applyRoom(snap.data())}
function applyRoom(d){
  const joined=R&&!R.b&&d.b,flip=!R||R.b!==d.b;R={a:d.a,b:d.b};
  const moves=Array.isArray(d.moves)?d.moves.slice():[];
  const same=d.deal===G.dealStr&&moves.length===G.moves.length&&moves.every((m,i)=>m===G.moves[i]);
  if(joined)toast('朋友加入了，可以开始');
  if(same){if(flip)render();return}
  if(busy&&d.deal===G.dealStr&&moves.length<G.moves.length)return;
  const grew=d.deal===G.dealStr&&moves.length>G.moves.length;
  if(d.deal!==G.dealStr){G.deal=JSON.parse(d.deal);G.dealStr=d.deal}
  G.moves=moves;rebuild();HINT=null;
  POP=grew;render();POP=false}
async function roomWrite(patch){
  if(P2P){Object.assign(P,patch);if(conn&&conn.open)conn.send(P);applyRoom(P)}
  else await roomRef.update({...patch,ts:Date.now()})}
/* 不用账号的联机：两个浏览器通过 PeerJS 直接相连，房主的页面保存牌局。 */
function loadPeer(){return window.Peer?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

  peer=new Peer(PRE+code);
  peer.on('open',()=>{P={a:'H',b:'',deal:JSON.stringify(genDeal(G.deal.level)),moves:[]};myId='H';G.mode='online';G.room=code;R=null;$('sheet').hidden=true;applyRoom(P);toast('房间号 '+code+'，发给朋友')});
  peer.on('connection',c=>{
    if(conn&&conn.open){c.on('open',()=>c.close());return}
    conn=c;
    c.on('open',()=>{if(!P)return;P.b='G';c.send(P);applyRoom(P)});
    c.on('data',d=>{if(!P||!d||typeof d.deal!=='string')return;P={deal:d.deal,moves:d.moves,a:'H',b:'G'};applyRoom(P)});
    c.on('close',()=>{if(conn===c){conn=null;if(P){P.b='';toast('对方离开了');applyRoom(P)}}})});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&n<5){try{peer.destroy()}catch(_){}p2pCreate(n+1)}else if(G.mode!=='online'){toast('创建失败，请稍后重试');p2pClose()}})}
async function p2pJoin(code){
  try{await loadPeer()}catch(e){return toast('联机组件没加载出来，请检查网络')}
  toast('正在连接…');let done=false;
  const fail=t=>{if(done)return;done=true;clearTimeout(timer);toast(t);p2pClose()};
  const timer=setTimeout(()=>fail('没连上。请确认房间号，并且房主的页面还开着'),15000);
  peer=new Peer();
  peer.on('open',()=>{
    conn=peer.connect(PRE+code,{reliable:true,serialization:'json'});
    conn.on('data',d=>{if(!d||typeof d.deal!=='string')return;
      if(!done){done=true;clearTimeout(timer);myId='G';G.mode='online';G.room=code;R=null;$('sheet').hidden=true}
      P=d;applyRoom(P)});
    conn.on('close',()=>{if(G.mode==='online'&&myId==='G'){toast('和房主的连接断开了');leaveRoom()}})});
  peer.on('error',e=>{if(G.mode==='online')return;fail(e.type==='peer-unavailable'?'没有找到这个房间':'连接失败，请稍后重试')})}
function leaveRoom(){
  if(P2P)p2pClose();
  if(unsub)unsub();unsub=null;roomRef=null;R=null;G.room=null;store.del('cp.room');
  const s=store.get('cp3.game');G.mode=s&&s.mode==='local2'?'local2':'solo';
  if(s&&s.deal)setDeal(s.deal,s.moves);else setDeal(genDeal(0));
  render()}

/* ---------- 事件 ---------- */
$('app').addEventListener('click',e=>{if(e.target.closest('#stock')&&canAct())play('d')});
$('menuBtn').onclick=()=>{renderSheet();$('sheet').hidden=false};
$('hintBtn').onclick=hint;$('undoBtn').onclick=undo;$('againBtn').onclick=restart;$('newBtn').onclick=()=>newDeal();
$('sheet').addEventListener('click',e=>{
  if(e.target===$('sheet'))return void($('sheet').hidden=true);
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='close')$('sheet').hidden=true;
  else if(a==='lv'){$('sheet').hidden=true;newDeal(+b.dataset.i)}
  else if(a==='mode'){if(G.mode==='online')leaveRoom();G.mode=b.dataset.m;save();$('sheet').hidden=true;render()}
  else if(a==='create')createRoom();
  else if(a==='join')joinRoom($('roomCode').value);
  else if(a==='leave'){leaveRoom();$('sheet').hidden=true}});
$('over').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='again')restart();else if(b.dataset.a==='new')newDeal();else newDeal(G.deal.level+1)});

/* ---------- 启动 ---------- */
(function start(){
  const s=store.get('cp3.game');
  if(s&&s.deal&&LV[s.deal.level]){G.mode=s.mode==='local2'?'local2':'solo';setDeal(s.deal,s.moves)}
  else{setDeal(genDeal(0));save()}
  render();
  (async()=>{
    try{
      if(window.claude&&window.claude.use){db=await window.claude.use('db');user=await window.claude.use('user');
        if(user){uid=await user.id();canWrite=await user.can('data.write')}}
      myId=uid;
    }catch(e){}
    capsReady=true;if(!$('sheet').hidden)renderSheet();
    const code=store.get('cp.room');if(!P2P&&db&&uid&&code)joinRoom(code,true)})()})();
</script>
